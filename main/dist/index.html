<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9 Kings - Authentic Living Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-D89UNL3z.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BciPHjoC.css">
</head>
<body>
  <div id="app">
    <!-- Fullscreen Canvas Rendering Pure 9 Kings Meadow, Perimeter Wall, Pine Forest & Pond -->
    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- Top Left Currency (✦ 25 +5) & Breaches -->
    <div id="top-left-hud">
      <div class="currency-display">
        <span class="currency-gem">✦</span>
        <span id="gold-counter" class="currency-value">25</span>
        <span class="currency-income">+5</span>
      </div>
      <div class="breach-display">
        <span class="breach-label">BREACHES:</span>
        <span id="breach-counter" class="breach-value">0 / 3</span>
      </div>
    </div>

    <!-- Left Vertical Spell & Relic Medallions (Official 9 Kings Steam Art) -->
    <div id="left-relic-bar">
      <button id="cast-spell-btn" class="relic-btn active" title="Rally Horn (King Active Spell)">
        <img src="./assets/relics/relic1.png" alt="Rally Horn" class="relic-img" />
        <span class="spell-name" style="display:none;">RALLY HORN</span>
        <span class="spell-cost" style="display:none;"></span>
      </button>
      <div class="relic-btn" title="Frost Ward">
        <img src="./assets/relics/relic2.png" alt="Frost Ward" class="relic-img" />
      </div>
      <div class="relic-btn" title="Arcane Surge">
        <img src="./assets/relics/relic3.png" alt="Arcane Surge" class="relic-img" />
      </div>
      <div class="relic-btn" title="War March">
        <img src="./assets/relics/relic4.png" alt="War March" class="relic-img" />
      </div>
    </div>

    <!-- Top Center Timeline & Year Progression -->
    <div id="top-timeline-bar">
      <div id="timeline-track-container">
        <div id="timeline-track"></div>
      </div>
      <div class="year-label">
        YEAR <span id="year-counter">1</span>
      </div>
    </div>

    <!-- Top Right Controls: Camera Zoom, Grid Territory, Speed -->
    <div id="top-right-controls">
      <button id="btn-zoom-planning" class="ctrl-pill-btn active" title="[1] Select Troops View (1.45x Zoom)">
        ⚔️ 1.45&times;
      </button>
      <button id="btn-zoom-battle" class="ctrl-pill-btn" title="[2] Combat Panorama (1.0x Zoom)">
        🛡️ 1.0&times;
      </button>
      <button id="btn-toggle-grid" class="ctrl-pill-btn" title="[G] Expand or Shrink Territory">
        🗺️ <span id="grid-size-label">3&times;3</span>
        <span id="grid-expand-btn-text" style="display:none;"></span>
      </button>
      <button id="auto-btn" class="ctrl-pill-btn active">auto</button>
      <button id="speed-btn" class="ctrl-pill-btn">▶▶</button>
    </div>

    <!-- Right Vertical Monarchs Roster -->
    <div id="right-monarch-bar">
      <div class="monarch-badge rival-blood" title="King of Blood">🩸</div>
      <div class="monarch-badge rival-spells" title="King of Spells">🔮</div>
      <div class="monarch-badge rival-time" title="King of Time">⏳</div>
      <div class="monarch-badge rival-greed" title="King of Greed">💰</div>
    </div>

    <!-- Bottom Turn Action Bar & Card Hand -->
    <div id="bottom-ui-container">
      <div id="hand-action-bar">
        <div id="leave-two-status" class="status-badge warning">
          RULE: LEAVE EXACTLY 2 CARDS IN HAND
        </div>
        <button id="end-year-btn" class="primary-btn royal-btn" disabled>
          READY FOR BATTLE
        </button>
      </div>
      <div id="card-hand" class="card-hand-flex"></div>
    </div>

    <!-- Subtle Keyboard Shortcuts Hint Pill (Toggleable via [H]) -->
    <div id="hud-hint-bar" class="hud-hint-pill-bar">
      <span class="hint-pill"><kbd>SPACE</kbd> Zoom</span>
      <span class="hint-pill"><kbd>G</kbd> Territory 3&times;3/4&times;4</span>
      <span class="hint-pill"><kbd>1</kbd>/<kbd>2</kbd> Mode</span>
      <span class="hint-pill"><kbd>Scroll</kbd> Zoom</span>
      <span class="hint-pill"><kbd>Drag</kbd> Pan</span>
      <span class="hint-pill"><kbd>H</kbd> Hints</span>
      <span id="current-mode-label" style="display:none;">SELECTING TROOPS & UPGRADES</span>
    </div>
  </div>

</body>
</html>
