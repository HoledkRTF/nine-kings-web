<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f17" />
  <title>Find The Imposter | Pass & Play Party Word Game</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="logo-badge">
        <div class="logo-icon">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M6 25.5C6 20.4 14.6 16.8 32 16.8s26 3.6 26 8.7c0 9.6-5.7 17.2-12 17.2-4.4 0-7.2-3.1-9.5-5.4-1.7-1.7-3.4-2.6-4.5-2.6s-2.8.9-4.5 2.6C25.2 39.6 22.4 42.7 18 42.7 11.7 42.7 6 35.1 6 25.5Z" fill="#ffffff"/>
            <ellipse cx="22.6" cy="28.4" rx="5.6" ry="4.4" transform="rotate(-8 22.6 28.4)" fill="#1b0d0d"/>
            <ellipse cx="41.4" cy="28.4" rx="5.6" ry="4.4" transform="rotate(8 41.4 28.4)" fill="#1b0d0d"/>
          </svg>
        </div>
        <span>Find The Imposter</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="sound-toggle" title="Toggle Sound" aria-label="Toggle Sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button class="icon-btn" id="rules-btn" title="How to play" aria-label="How to play">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="app">

    <!-- Main Screens Container -->
    <main id="screen-container">
      <div class="boot-fallback" id="boot-fallback">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p>Loading the game…</p>
        <p class="boot-error-text">Couldn’t load the game. Refresh the page.</p>
      </div>
    </main>
  </div>

  <script type="module" src="./game.js" onerror="document.getElementById('boot-fallback')?.classList.add('is-error')"></script>
</body>
</html>
