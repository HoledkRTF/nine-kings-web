<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f17" />
  <title>Find The Imposter | Pass & Play Party Word Game</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div id="app">
    <!-- Top Bar -->
    <header>
      <div class="logo-badge">
        <div class="logo-icon">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M11 25.5C11 18 20.5 13 32 13s21 5 21 12.5C53 41 43.5 53 32 53S11 41 11 25.5Z" fill="#180a0a"/>
            <path d="M18 22c8-3.4 20-3.4 28 0" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity=".45"/>
            <ellipse cx="24" cy="28.5" rx="5" ry="3.8" fill="#fff"/>
            <ellipse cx="40" cy="28.5" rx="5" ry="3.8" fill="#fff"/>
            <circle cx="24.6" cy="29" r="1.9" fill="#180a0a"/>
            <circle cx="39.4" cy="29" r="1.9" fill="#180a0a"/>
            <path d="M25.5 39.5c4.6 3.2 8.4 3.2 13 0" stroke="#f87171" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </div>
        <span>Find The Imposter</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="sound-toggle" title="Toggle Sound" aria-label="Toggle Sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button class="icon-btn" id="rules-btn" title="How to play" aria-label="How to play">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Screens Container -->
    <main id="screen-container">
      <!-- Injected by game.js -->
    </main>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
