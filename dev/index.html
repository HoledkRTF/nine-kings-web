<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Find The Imposter | Pass & Play Party Word Game</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div id="app">
    <!-- Top Bar -->
    <header>
      <div class="logo-badge">
        <div class="logo-icon">🕵️</div>
        <span>Find The Imposter</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="sound-toggle" title="Toggle Sound">🔊</button>
        <button class="icon-btn" id="rules-btn" title="How to play">❓</button>
      </div>
    </header>

    <!-- Main Screens Container -->
    <main id="screen-container">
      <!-- Injected by game.js -->
    </main>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
