<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9 Kings - Authentic 2.5D Isometric Web Recreation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <!-- Ornate Medieval Timeline & HUD Header -->
    <header id="timeline-header">
      <div class="header-crown-crest">👑</div>
      <div class="header-stat">
        <span class="label">YEAR</span>
        <span id="year-counter" class="value text-gold">1</span>
      </div>
      <div id="timeline-track-container">
        <div id="timeline-track"></div>
      </div>
      <div class="header-stat">
        <span class="label">TREASURY</span>
        <span id="gold-counter" class="value text-gold">25g</span>
      </div>
      <div class="header-stat">
        <span class="label">BREACHES</span>
        <span id="breach-counter" class="value text-crimson">0 / 3</span>
      </div>
    </header>

    <!-- Center 2.5D Isometric Battlefield & Floating Kingdom Diorama -->
    <main id="battle-container">
      <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- King Active Spell Medallion -->
      <div id="spell-bar">
        <button id="cast-spell-btn" class="spell-btn">
          <div class="spell-gem">⚡</div>
          <div class="spell-info">
            <span class="spell-name">RALLY HORN</span>
            <span class="spell-cost">Cost: 0g</span>
          </div>
        </button>
      </div>
    </main>

    <!-- Bottom Medieval Card Hand Tray & Leave Two Status -->
    <footer id="hand-tray-footer">
      <div id="hand-status-bar">
        <div id="leave-two-status" class="status-badge warning">
          RULE: LEAVE EXACTLY 2 CARDS IN HAND
        </div>
        <button id="end-year-btn" class="primary-btn royal-gold-btn" disabled>
          READY FOR BATTLE
        </button>
      </div>
      <div id="card-hand" class="card-hand-flex"></div>
    </footer>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
